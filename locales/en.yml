_version: 1

# Command line
cli.help: |
  Usage:
    pedal                              Open the GUI
    pedal <file>                       Open a file in the GUI
    pedal analyze <input> -o <dir>      Export all ABC records without opening a window
    pedal --help                       Show this help
    pedal --version                    Show the version

  Input: .abc, .hap, .hsp, .har, .app (including nested packages).
  -o, --output <dir> is required; use a new or empty directory.
  Use -- before an input beginning with '-', and ./ before an output beginning with '-'.
  Each ABC gets a numbered directory. manifest.json maps sources to original records and lists failures.
  Exit codes: 0 = success, 1 = analysis/export failure (including partial results), 2 = invalid arguments.
cli.version: "Pedal %{version}"
cli.unknown_option: "Unknown option: %{option}"
cli.duplicate_output: "Specify -o / --output only once."
