_version: 1

# 命令行
cli.help: |
  用法：
    pedal                              打开 GUI
    pedal <file>                       在 GUI 中打开文件
    pedal analyze <input> -o <dir>      无窗口导出所有 ABC record
    pedal --help                       显示帮助
    pedal --version                    显示版本

  输入支持 .abc、.hap、.hsp、.har、.app（包括嵌套包）。
  必须指定 -o, --output <dir>，使用新目录或空目录。
  以 - 开头的输入前加 --，以 - 开头的输出路径前加 ./。
  每个 ABC 使用独立编号目录；manifest.json 记录源码与原始 record 的对应关系及失败详情。
  退出码：0 = 成功，1 = 分析或导出失败（包括部分失败），2 = 参数错误。
cli.version: "Pedal %{version}"
cli.unknown_option: "未知选项：%{option}"
cli.duplicate_output: "-o / --output 只能指定一次。"
cli.missing_output: "请通过 -o <dir> 或 --output <dir> 指定输出目录。"
cli.missing_input: "请在 analyze 后指定输入文件。"
cli.unexpected_argument: "多余或无效的参数：%{argument}"
cli.complete: "已处理 %{abcs} 个 ABC，导出 %{records} 个 record，失败 %{failures} 项。清单：%{path}"
cli.error: "错误：%{error}"
cli.entry_failed: "处理失败：%{path}：%{error}"
cli.processing: "正在分析第 %{count} 个 ABC：%{path}"
cli.empty_record: "此 record 未生成源码（例如外部类型或仅含元数据的声明）。"
cli.package_depth: "嵌套包深度超过上限 %{limit}。"
cli.unsupported_input: "不支持的输入：%{path}。请使用 .abc、.hap、.hsp、.har 或 .app。"
cli.output_not_empty: "输出目录非空：%{path}。请选择新目录或空目录。"
cli.no_abc: "包内未找到 ABC 文件。"
cli.io_error: "%{path}：%{error}"

