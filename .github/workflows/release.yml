name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pedal.exe
            asset_name: pedal-windows-x86_64.exe
          - os: ubuntu-latest
            artifact_name: pedal
            asset_name: pedal-linux-x86_64
          - os: macos-latest
            artifact_name: pedal
            asset_name: pedal-macos-aarch64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            libasound2-dev

      - name: Build
        run: cargo build --release

      - name: Create macOS .app bundle
        if: runner.os == 'macOS'
        run: |
          # Convert .png to .icns
          mkdir -p icon.iconset
          sips -s format png -z 1024 1024 crates/egui-shell/icon.png --out icon.iconset/icon_512x512@2x.png
          sips -s format png -z 512 512 crates/egui-shell/icon.png --out icon.iconset/icon_512x512.png
          sips -s format png -z 256 256 crates/egui-shell/icon.png --out icon.iconset/icon_256x256@2x.png
          sips -s format png -z 256 256 crates/egui-shell/icon.png --out icon.iconset/icon_256x256.png
          sips -s format png -z 128 128 crates/egui-shell/icon.png --out icon.iconset/icon_128x128@2x.png
          sips -s format png -z 128 128 crates/egui-shell/icon.png --out icon.iconset/icon_128x128.png
          iconutil -c icns icon.iconset -o Pedal.icns

          # Build .app bundle
          mkdir -p Pedal.app/Contents/{MacOS,Resources}
          cp target/release/${{ matrix.artifact_name }} Pedal.app/Contents/MacOS/pedal
          chmod +x Pedal.app/Contents/MacOS/pedal
          cp Pedal.icns Pedal.app/Contents/Resources/Pedal.icns

          cat > Pedal.app/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>pedal</string>
            <key>CFBundleIdentifier</key>
            <string>com.pedal.app</string>
            <key>CFBundleName</key>
            <string>Pedal</string>
            <key>CFBundleDisplayName</key>
            <string>Pedal</string>
            <key>CFBundleVersion</key>
            <string>0.0.1</string>
            <key>CFBundleShortVersionString</key>
            <string>0.0.1</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>Pedal.icns</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          codesign --deep --force --sign - --options runtime Pedal.app

      - name: Rename artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent Pedal.app ${{ matrix.asset_name }}
          else
            cp target/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | Windows | `pedal-windows-x86_64.exe` |
            | Linux | `pedal-linux-x86_64` |
            | macOS | `pedal-macos-aarch64.zip` |

            ### macOS 首次运行

            macOS Gatekeeper 会拦截未公证的应用，首次打开请执行：

            ```bash
            xattr -cr Pedal.app
            ```
          files: ${{ matrix.asset_name }}
        if: matrix.os == 'windows-latest'

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}
        if: matrix.os != 'windows-latest'
