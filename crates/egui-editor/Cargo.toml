[package]
name = "egui-editor"
version = "0.2.1"
edition = "2024"
description = "Syntax-highlighted code viewer for egui"
license = "MIT"

[dependencies]
eframe = { version = "0.34.1", default-features = false, features = ["glow"] }
tree-sitter = "0.24"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-sequel = "0.3"
tree-sitter-typescript = "0.23"
phf = { version = "0.11", features = ["macros"] }
regex = "1"
