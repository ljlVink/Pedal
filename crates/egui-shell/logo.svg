  <ns0:title id="title">Pedal</ns0:title>
  <ns0:desc id="description">Pedal: mint-green playful outlined lettering with curved interior shading, a white sticker edge, slate-blue cast shadow, an apricot sparkle, and a miniature pedal. Transparent background. All lettering is vector paths.</ns0:desc>
