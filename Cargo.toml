[workspace]
members = [".", "crates/egui-animation", "crates/egui-editor", "crates/egui-hex-view", "crates/egui-keybind", "crates/egui-notify", "crates/egui-shell", "crates/pedal-abc-bridge", "crates/pedal-archive", "crates/tabookit"]

[package]
name = "pedal"
version = "0.0.1"
edition = "2024"

[dependencies]
mimalloc = "0.1"
log = "0.4"
env_logger = "0.11"
eframe = { version = "0.34.1", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui_dock = "0.19"
egui-notify = { path = "crates/egui-notify" }
egui-animation = { path = "crates/egui-animation" }
egui-editor = { path = "crates/egui-editor" }
egui-hex-view = { path = "crates/egui-hex-view" }
egui-keybind = { path = "crates/egui-keybind", features = ["serde"] }
egui-shell = { path = "crates/egui-shell" }
pedal-abc-bridge = { path = "crates/pedal-abc-bridge" }
pedal-archive = { path = "crates/pedal-archive" }
tabookit = { path = "crates/tabookit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
encoding_rs = "0.8"
chardetng = "1"
sha2 = "0.11"
indexmap = "2"
regex = "1"
rust-i18n = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
toml = "0.8"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[patch.crates-io]
egui_dock = { path = "crates/egui-dock-patch" }
egui = { path = "crates/egui-patch" }
